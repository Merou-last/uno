/* ===== واجهة خرافية: زجاج + حركة ===== */
body{background:#070914!important;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-2;background:radial-gradient(circle at 18% 22%,#6d3bff66,transparent 42%),radial-gradient(circle at 82% 28%,#f4c45e40,transparent 40%),radial-gradient(circle at 50% 95%,#00d0ff40,transparent 45%);animation:aur 16s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 38% 62%,#ffe9a8,transparent),radial-gradient(2px 2px at 72% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 88% 78%,#bda8ff,transparent),radial-gradient(1.5px 1.5px at 55% 12%,#fff,transparent);background-size:340px 340px;animation:tw 4s ease-in-out infinite}
@keyframes aur{to{transform:translate(4%,3%) scale(1.15) rotate(6deg)}}
@keyframes tw{50%{opacity:.35}}
@keyframes shine{to{background-position:300% 0}}
@keyframes fl{50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes rise{from{opacity:0;transform:translateY(34px) scale(.94)}}
@keyframes fan{to{transform:translateX(calc(var(--r)*1.6)) rotate(calc(var(--r)*1.35)) translateY(-6px)}}
@keyframes glow{50%{box-shadow:inset 0 1px 0 #fff6,0 0 26px var(--a,#8c6cff)}}
@keyframes flip{from{transform:rotateY(90deg)}}
/* عناوين مزخرفة */
h1,h2,.card h3{background:linear-gradient(90deg,#fff,#f4c45e,#ff9be0,#8c6cff,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite;filter:drop-shadow(0 0 12px #f4c45e55);letter-spacing:.6px}
h1 span{color:transparent}
h2::before,h2::after{content:" ❖ ";color:#f4c45e;-webkit-text-fill-color:#f4c45e;font-size:.7em}
.card h3{font-size:22px;text-align:center}
.card h3::before{content:"✦ ";-webkit-text-fill-color:#f4c45e}.card h3::after{content:" ✦";-webkit-text-fill-color:#f4c45e}
#gameTitle::before,#gameTitle::after{content:" ✦ ❖ ✦ "}
/* أزرار زجاجية */
button:not(.ucard):not(.u-cb),a,.btn{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.04))!important;border:1px solid rgba(255,255,255,.3)!important;-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 22px rgba(0,0,0,.35);color:#fff;font-family:inherit;transition:transform .25s,box-shadow .3s}
button:not(.ucard):not(.u-cb)::after,a::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-130%);transition:transform .7s;pointer-events:none}
button:not(.ucard):not(.u-cb):hover::after,a:hover::after{transform:translateX(130%)}
button:not(.ucard):not(.u-cb):hover:not(:disabled),a:hover{transform:translateY(-3px) scale(1.04);box-shadow:inset 0 1px 0 #fff6,0 12px 30px var(--a,#8c6cff)}
button:not(.ucard):not(.u-cb):active:not(:disabled),a:active{transform:scale(.95)}
.card button,.primary{background:linear-gradient(135deg,rgba(140,108,255,.65),rgba(255,120,220,.18))!important;animation:glow 3s ease-in-out infinite}
button:disabled{opacity:.45}
/* بطاقات الألعاب */
.card{--a:#8c6cff;--b:#06b6d4;position:relative;overflow:hidden;padding:0!important;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02))!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2)!important;border-radius:24px!important;animation:rise .7s both;animation-delay:calc(var(--i)*.09s);transition:transform .35s,box-shadow .35s}
.card:hover{transform:translateY(-8px) rotate(-.6deg);box-shadow:0 22px 50px -12px var(--a)}
.cb{padding:14px 16px 20px;text-align:center}
.art{position:relative;height:132px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 30% 18%,rgba(255,255,255,.5),transparent 42%),linear-gradient(135deg,var(--a),var(--b))}
.art::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 14px,rgba(255,255,255,.08) 14px 28px)}
.big{font-size:66px;z-index:1;filter:drop-shadow(0 8px 10px #0009);animation:fl 3.2s ease-in-out infinite}
.mc2{position:absolute;width:52px;height:76px;border-radius:10px;border:3px solid #fff;background:var(--c);color:#fff;font:900 22px/70px system-ui;text-align:center;transform:translateX(calc(var(--r)*1.6)) rotate(var(--r));animation:fan 3s ease-in-out infinite alternate;z-index:1;box-shadow:0 8px 16px #0007}
.sp{position:absolute;font-style:normal;color:#fff;z-index:2;animation:tw 2.4s infinite}.s1{top:12%;right:14%}.s2{bottom:16%;left:12%;animation-delay:.8s}.s3{top:22%;left:30%;animation-delay:1.5s}
.hero,.area{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-color:rgba(255,255,255,.18)!important;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02))!important}
/* أوراق UNO أجمل */
.ucard{position:relative;overflow:hidden;box-shadow:0 8px 16px #0008;border-radius:14px}
.ucard::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.4),transparent 48%);pointer-events:none}
.ucard>*{position:relative;z-index:1}
.ucard b{display:grid;place-items:center;width:78%;aspect-ratio:.78;background:#fff;border-radius:50%;transform:rotate(-22deg);text-shadow:none;box-shadow:inset 0 -3px 6px #0003}
.c-red b{color:#d6334a}.c-yellow b{color:#b88a00}.c-green b{color:#1f8a4f}.c-blue b{color:#2f6fd0}.c-wild b{color:#222}
.c-back{background:radial-gradient(ellipse at center,#d6334a 0 40%,#12131c 41%)!important;border-color:#f4c45e!important}
.ucard:not(:disabled):hover{transform:translateY(-10px) scale(1.07) rotate(-2deg)}
/* ألعاب جديدة */
.xo{display:grid;grid-template-columns:repeat(3,84px);gap:10px;justify-content:center;margin:14px 0}.xc{height:84px;font-size:34px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:380px;margin:14px auto}.mc{height:74px;font-size:30px;animation:flip .3s}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important}}

const q=s=>b.querySelector(s);
function stop(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];if(turnTimer){clearInterval(turnTimer);turnTimer=null}}
function leave(){stop();try{localStorage.removeItem('unoRoom')}catch(e){}room=null;hand=[];members=[];H=null;code='';uno(b)}
function lab(c){return SYM[c.v]||c.v}
function isNum(c){return c.c&&/^\d$/.test(c.v)}
function pts(c){return isNum(c)?+c.v:(c.c?20:50)}
function mod(x,n){return((x%n)+n)%n}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function buildDeck(){let id=0;const d=[];const mk=(c,v)=>d.push({id:++id,c:c,v:v});COLORS.forEach(c=>{mk(c,'0');for(let i=1;i<=9;i++){mk(c,''+i);mk(c,''+i)}['skip','rev','d2'].forEach(v=>{mk(c,v);mk(c,v)})});for(let i=0;i<4;i++){mk(null,'wild');mk(null,'w4')}return d}
function cardHTML(c,cls,attr){const k=c.c||'wild';return '<button class="ucard c-'+k+(cls?' '+cls:'')+'" '+(attr||'')+' aria-label="'+(c.c?CN[c.c]+' ':'')+esc(lab(c))+'"><i>'+esc(lab(c))+'</i><b>'+esc(lab(c))+'</b><i>'+esc(lab(c))+'</i></button>'}
function errText(e){const c=(e&&e.code)||'';if(/operation-not-allowed|admin-restricted/.test(c))return 'فعّل Anonymous في Firebase: Authentication ← Sign-in method.';if(/permission-denied/.test(c))return 'القواعد غير منشورة أو ترفض العملية. انشر firestore.rules الجديد.';if(/network|unavailable/.test(c))return 'مشكلة اتصال بالإنترنت.';return 'خطأ: '+((e&&(e.code||e.message))||e)}

/* ---------- محرك المضيف (الحَكَم) ---------- */
function hDraw(u,n){let g=0;for(let i=0;i<n;i++){if(!H.deck.length){const t=H.disc.pop();H.deck=shuffle(H.disc);H.disc=[t]}if(!H.deck.length)break;H.hands[u].push(H.deck.pop());g++}return g}
function hPlayable(c,h){if(c.v==='wild')return true;if(c.v==='w4')return !h.some(x=>x.c===H.color);return c.c===H.color||c.v===H.disc[H.disc.length-1].v}
function hAdv(s){H.turn=mod(H.turn+H.dir*s,H.order.length);H.drawn=null}
function hRound(){
 H.round++;H.deck=shuffle(buildDeck());H.disc=[];H.hands={};
 H.order.forEach(u=>{H.hands[u]=[]});H.order.forEach(u=>hDraw(u,7));
 let c;do{c=H.deck.pop();if(!isNum(c)){H.deck.unshift(c);c=null}}while(!c);
 H.disc.push(c);H.color=c.c;H.dir=1;H.turn=(H.round-1)%H.order.length;H.drawn=null;H.status='playing';H.winner=null;H.gained=0;
 H.msg='بدأت الجولة '+H.round+' — الدور على '+H.names[H.order[H.turn]];
}
function pub(){const t=H.disc[H.disc.length-1],counts={};H.order.forEach(u=>{counts[u]=H.hands[u].length});return{status:H.status,order:H.order,names:H.names,counts:counts,top:t,color:H.color,dir:H.dir,turn:H.order[H.turn],deckN:H.deck.length,drawn:H.drawn,msg:H.msg,round:H.round,scores:H.scores,winner:H.winner,gained:H.gained,matchWinner:H.matchWinner,v:Date.now()}}
async function commit(dirty){
 const F=X.F,db=X.db,bt=F.writeBatch(db);
 bt.update(F.doc(db,'unoRooms',code),pub());
 dirty.forEach(u=>bt.set(F.doc(db,'unoRooms',code,'hands',u),{cards:H.hands[u]}));
 bt.set(F.doc(db,'unoRooms',code,'private','host'),H);
 await bt.commit();
}
function doAct(a){
 if(!H||H.status!=='playing')return;
 const n=H.order.length,u=H.order[H.turn];
 if(a.uid!==u)return;
 const h=H.hands[u],nm=H.names[u],dirty=[u];
 if(a.type==='draw'){
  if(H.drawn!==null)return;
  const g=hDraw(u,1);
  if(!g){H.msg=nm+': لا توجد بطاقات للسحب';hAdv(1);return commit(dirty)}
  const nc=h[h.length-1];
  if(hPlayable(nc,h)){H.drawn=nc.id;H.msg=nm+' سحب بطاقة'}else{H.msg=nm+' سحب بطاقة وتمرّر';hAdv(1)}
  return commit(dirty);
 }
 if(a.type==='pass'){if(H.drawn===null)return;H.msg=nm+' مرّر دوره';hAdv(1);return commit(dirty)}
 if(a.type==='play'){
  const card=h.find(c=>c.id===a.cardId);
  if(!card)return;
  if(H.drawn!==null&&card.id!==H.drawn)return;
  if(!hPlayable(card,h))return;
  if(!card.c&&COLORS.indexOf(a.color)<0)return;
  h.splice(h.indexOf(card),1);H.disc.push(card);H.color=card.c||a.color;H.drawn=null;
  let txt=nm+' لعب '+(card.c?CN[card.c]+' ':'')+lab(card);
  if(!card.c)txt+=' واختار '+CN[H.color];
  let steps=1;const nx=H.order[mod(H.turn+H.dir,n)];
  if(card.v==='skip'){steps=2;txt+=' — تخطّى '+H.names[nx]}
  else if(card.v==='rev'){H.dir*=-1;if(n===2)steps=2;txt+=' — انعكس الاتجاه'}
  else if(card.v==='d2'){const g=hDraw(nx,2);dirty.push(nx);steps=2;txt+=' — '+H.names[nx]+' سحب '+g}
  else if(card.v==='w4'){const g=hDraw(nx,4);dirty.push(nx);steps=2;txt+=' — '+H.names[nx]+' سحب '+g}
  if(h.length===1){if(a.uno)txt+=' — UNO!';else{hDraw(u,2);txt+=' — نسي UNO! عقوبة سحب بطاقتين'}}
  H.msg=txt;
  if(!h.length){
   let sum=0;H.order.forEach(x=>{if(x!==u)H.hands[x].forEach(c=>{sum+=pts(c)})});
   H.scores[u]+=sum;H.status='over';H.winner=u;H.gained=sum;
   if(H.scores[u]>=WIN)H.matchWinner=u;
   H.msg=nm+' أنهى أوراقه وفاز بالجولة (+'+sum+')';
   return commit(dirty);
  }
  H.turn=mod(H.turn+H.dir*steps,n);
  return commit(dirty);
 }
}
function bestAutoColor(h){const cnt={red:0,yellow:0,green:0,blue:0};h.forEach(c=>{if(c.c)cnt[c.c]++});return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]}
function hostRun(a){queue=queue.then(()=>doAct(a)).catch(e=>{console.error(e)});return queue}
function startGame(){
 const ms=members.slice().sort((x,y)=>x.joinedAt-y.joinedAt);
 const host=room.host,order=[host].concat(ms.map(m=>m.id).filter(i=>i!==host)).slice(0,MAXP);
 if(order.length<2)return;
 const names={};order.forEach(u=>{const m=members.find(x=>x.id===u);names[u]=m?m.name:'لاعب'});
 const scores={};order.forEach(u=>{scores[u]=0});
 H={order:order,names:names,scores:scores,round:0,status:'playing',winner:null,gained:0,matchWinner:null,dir:1,drawn:null,msg:'',deck:[],disc:[],hands:{},turn:0,color:'red'};
 hRound();
 queue=queue.then(()=>commit(order)).catch(e=>{console.error(e)});
}
function nextRound(){
 if(!H||H.status!=='over')return;
 if(H.matchWinner){H.round=0;H.matchWinner=null;H.order.forEach(u=>{H.scores[u]=0})}
 hRound();
 queue=queue.then(()=>commit(H.order)).catch(e=>{console.error(e)});
}
function hostSkip(){
 if(!H||H.status!=='playing')return;
 const u=H.order[H.turn];H.msg='تخطّى المضيف دور '+H.names[u];hAdv(1);
 queue=queue.then(()=>commit([])).catch(e=>{console.error(e)});
}

/* ---------- اتصال ---------- */
async function send(type,extra){
 const a={uid:X.uid,type:type,cardId:extra&&extra.cardId!=null?extra.cardId:null,color:(extra&&extra.color)||null,uno:!!said,t:Date.now()};
 if(type==='play')said=false;
 if(room.host===X.uid)hostRun(a);
 else{try{await X.F.addDoc(X.F.collection(X.db,'unoRooms',code,'actions'),a)}catch(e){alert(errText(e))}}
}
function myTurn(){return room&&room.status==='playing'&&room.turn===X.uid}
function playable(c){if(c.v==='wild')return true;if(c.v==='w4')return !hand.some(x=>x.c===room.color);return c.c===room.color||c.v===room.top.v}
function onCard(id){
 if(!myTurn())return;
 const c=hand.find(x=>x.id===id);if(!c)return;
 if(room.drawn!==null&&room.drawn!==c.id){flash('بعد السحب العب البطاقة المسحوبة فقط أو مرّر.');return}
 if(!playable(c)){flash(c.v==='w4'?'+4 لا تُلعب إلا إذا لم تملك لون الورقة الحالية.':'هذه البطاقة غير مطابقة.');return}
 if(!c.c){pick=c.id;render();return}
 pick=null;send('play',{cardId:c.id});
}
function flash(t){const m=q('#oMsg');if(m)m.textContent=t}
function enter(){
 const F=X.F,db=X.db,uid=X.uid;
 try{localStorage.setItem('unoRoom',code)}catch(e){}
 unsubs.push(F.onSnapshot(F.doc(db,'unoRooms',code),async s=>{
  if(!s.exists()){room={status:'closed'};render();return}
  room=s.data();
  if(room.host===uid&&!H&&!hostLoading&&room.status!=='lobby'){
   hostLoading=true;
   try{const p=await F.getDoc(F.doc(db,'unoRooms',code,'private','host'));if(p.exists())H=p.data()}catch(e){console.error(e)}
   hostLoading=false;
  }
  render();
 },e=>{room={status:'closed'};render()}));
 unsubs.push(F.onSnapshot(F.collection(db,'unoRooms',code,'members'),s=>{members=s.docs.map(d=>Object.assign({id:d.id},d.data()));render()}));
 unsubs.push(F.onSnapshot(F.doc(db,'unoRooms',code,'hands',uid),s=>{hand=s.exists()?(s.data().cards||[]):[];render()},e=>{}));
 unsubs.push(F.onSnapshot(F.collection(db,'unoRooms',code,'actions'),s=>{
  if(!room||room.host!==uid)return;
  const adds=s.docChanges().filter(c=>c.type==='added').map(c=>({ref:c.doc.ref,d:c.doc.data()})).sort((x,y)=>(x.d.t||0)-(y.d.t||0));
  adds.forEach(x=>{queue=queue.then(async()=>{await doAct(x.d);try{await F.deleteDoc(x.ref)}catch(e){}}).catch(e=>{console.error(e)})});
 },e=>{}));
 if(!turnTimer)turnTimer=setInterval(()=>{if(!alive()||!room||room.status!=='playing')return;const key=room.round+':'+room.turn+':'+room.status;if(key!==lastTurnKey){lastTurnKey=key;turnBegan=Date.now()}const left=Math.max(0,(room.turnSeconds||30)-Math.floor((Date.now()-turnBegan)/1000));const timerEl=q('#oTimer');if(timerEl)timerEl.textContent='⏱ '+left+'ث';if(left===0&&Date.now()-lastAutoAt>1800&&room.host===uid&&H&&H.status==='playing'){lastAutoAt=Date.now();const u=H.order[H.turn],hh=H.hands[u]||[];if(H.drawn!==null){const c=hh.find(x=>x.id===H.drawn);if(c&&hPlayable(c,hh))hostRun({uid:u,type:'play',cardId:c.id,color:c.c?null:bestAutoColor(hh),uno:false,t:Date.now()});else hostRun({uid:u,type:'pass',t:Date.now()})}else{const opts=hh.filter(c=>hPlayable(c,hh));if(opts.length){const c=opts[0];hostRun({uid:u,type:'play',cardId:c.id,color:c.c?null:bestAutoColor(hh),uno:false,t:Date.now()})}else hostRun({uid:u,type:'draw',t:Date.now()})}}},1000);
 render();
}
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=A[Math.floor(Math.random()*A.length)];return s}
async function createRoom(name,turnSeconds){
 X=await X_();const F=X.F,db=X.db;let ok=false;
 for(let i=0;i<6&&!ok;i++){
  const c=genCode(),ref=F.doc(db,'unoRooms',c);
  const s=await F.getDoc(ref);if(s.exists())continue;
  await F.setDoc(ref,{host:X.uid,hostName:name,status:'lobby',created:Date.now(),turnSeconds:Number(turnSeconds)||30});code=c;ok=true;
 }
 if(!ok)throw new Error('تعذّر إنشاء كود');
 await F.setDoc(F.doc(db,'unoRooms',code,'members',X.uid),{name:name,joinedAt:Date.now()});
 H=null;enter();
}
async function joinRoom(c,name){
 X=await X_();const F=X.F,db=X.db;c=c.trim().toUpperCase();
 const s=await F.getDoc(F.doc(db,'unoRooms',c));
 if(!s.exists())throw new Error('الغرفة غير موجودة');
 const r=s.data(),mine=await F.getDoc(F.doc(db,'unoRooms',c,'members',X.uid));
 if(!mine.exists()){
  if(r.status!=='lobby')throw new Error('بدأت اللعبة في هذه الغرفة');
  const all=await F.getDocs(F.collection(db,'unoRooms',c,'members'));
  if(all.size>=MAXP)throw new Error('الغرفة ممتلئة (4 لاعبين)');
  await F.setDoc(F.doc(db,'unoRooms',c,'members',X.uid),{name:name,joinedAt:Date.now()});
 }
 code=c;H=null;enter();
}
async function resumeRoom(c){X=await X_();code=c;H=null;enter()}
async function X_(){return X||await loadFB()}

 +'<div class="row"><input id="oCode" maxlength="5" placeholder="كود الغرفة" style="width:140px;text-transform:uppercase"><button class="primary" id="oJoin">دخول</button></div>'

 +'<div class="status" id="oErr" style="display:'+(msg?'block':'none')+'">'+esc(msg||'')+'</div></div>';
 const name=()=>{const v=q('#oName').value.trim().slice(0,20);try{localStorage.setItem('unoName',v)}catch(e){}return v};
 const run=async f=>{q('#oErr').style.display='block';q('#oErr').textContent='جارٍ الاتصال...';try{await f()}catch(e){if(alive())entry(errText(e))}};

 async function processAction(a){if(!room||room.host!==X.uid||room.status!=='playing'||!players.some(p=>p.id===a.uid))return;const s=JSON.parse(JSON.stringify(room.state));let msg='';
  if(game==='xo'){if(players[s.turn%players.length]?.id!==a.uid||s.over||!Number.isInteger(a.payload.cell)||s.board[a.payload.cell])return;s.board[a.payload.cell]=s.turn%2?'⭕':'❌';if(checkXO(s.board,s.board[a.payload.cell])){s.over=true;s.winner=a.uid;msg=players.find(p=>p.id===a.uid)?.displayName+' فاز! 🏆'}else if(s.board.every(Boolean)){s.over=true;msg='تعادل 🤝'}else{s.turn++;msg='الدور على '+players[s.turn%players.length].displayName}}

  else if(game==='mem'){const i=Number(a.payload.index);if(!Number.isInteger(i)||i<0||i>=s.cards.length||s.matched.includes(i)||s.opened.includes(i)||s.over)return;s.opened.push(i);if(s.opened.length===2){if(s.cards[s.opened[0]]===s.cards[s.opened[1]]){s.matched.push(...s.opened);s.opened=[];msg='زوج صحيح!';}else msg='ليست متطابقة';s.openedAt=Date.now();if(s.matched.length===s.cards.length)s.over=true;else s.turn=(s.turn+1)%players.length;}else msg='اختر بطاقة ثانية';}

const mb=$('muteBtn');mb.textContent=muted?'🔇':'🔊';
mb.onclick=()=>{muted=!muted;mb.textContent=muted?'🔇':'🔊';try{localStorage.setItem('mute',muted?'1':'0')}catch(e){}if(!muted)sfx.tick()};
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('button,a')&&e.target!==mb)sfx.tick()},true);
function confetti(){if(RM)return;const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext('2d'),P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:Math.random()*4-2,vy:2+Math.random()*4,r:5+Math.random()*6,a:Math.random()*6,h:Math.floor(Math.random()*360)}));let f=0;(function L(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.15;x.fillStyle='hsl('+p.h+',90%,60%)';x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore()});if(++f<220)requestAnimationFrame(L);else c.remove()})()}
/* كشف الفوز ودورك */
const gb=$('gameBody');let armW=false,armT=false,tm=0;
if(gb)new MutationObserver(()=>{clearTimeout(tm);tm=setTimeout(()=>{const s=gb.innerText||'';
const w=/فزت|الفوز لك|أحسنت|صحيح|🏆/.test(s)&&!/فاز البوت|خسرت/.test(s);
if(w&&!armW){armW=true;sfx.win();confetti();navigator.vibrate&&navigator.vibrate([60,40,60])}if(!w)armW=false;
const t=/دورك الآن/.test(s);if(t&&!armT){armT=true;sfx.ping();navigator.vibrate&&navigator.vibrate(80)}if(!t)armT=false},150)}).observe(gb,{childList:true,subtree:true,characterData:true});
/* إبقاء الشاشة مضاءة أثناء اللعب (مهم للمضيف) */
let wl=null,isOpen=false;async function lock(){try{if('wakeLock' in navigator)wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(isOpen&&document.visibilityState==='visible')lock()});
const oo=window.openGame,oc=window.closeGame;
if(oo)window.openGame=function(){isOpen=true;lock();return oo.apply(this,arguments)};
if(oc)window.closeGame=function(){isOpen=false;try{wl&&wl.release()}catch(e){}return oc.apply(this,arguments)};
/* زر ملء الشاشة */
const row=document.querySelector('#play .row');
if(row&&document.documentElement.requestFullscreen){const b=document.createElement('button');b.className='btn';b.textContent='⛶ ملء الشاشة';b.onclick=()=>{document.fullscreenElement?document.exitFullscreen():$('play').requestFullscreen()};row.insertBefore(b,row.lastElementChild)}
/* تحذير قبل مغادرة غرفة نشطة */
addEventListener('beforeunload',e=>{if(isOpen&&gb&&/كود الغرفة/.test(gb.innerText||'')){e.preventDefault();e.returnValue=''}});
})();
</script>
</body></html>
